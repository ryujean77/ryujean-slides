<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강의 · 마이웨이 아카데미</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="community.css">
<style>
.course-crumb { margin: 0 0 14px; font-size: 14px; color: var(--muted); }
.course-crumb a { text-decoration: none; }
.course-crumb a:hover { text-decoration: underline; }
.course-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.course-meta span { padding: 3px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 14px; }
.course-share { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 20px; }
.course-share [role="status"] { color: var(--muted); font-size: 14px; }
.course-tabs { scroll-margin-top: 80px; }
.course-tabs .tab { flex: 0 0 auto; }
.intro { max-width: none; gap: 32px; }
.intro > section { max-width: var(--read); }
.intro .intro-grid { max-width: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.intro-grid > section, .teacher-card { padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); min-width: 0; }
.intro-grid h2, .teacher-card h2 { margin-bottom: 12px; }
.intro .intro-curriculum { max-width: none; }
.intro-curriculum .intro-controls { margin: 0 0 16px; }
.intro-curriculum details { border-bottom: 1px solid var(--line); padding: 12px 0; }
.intro-curriculum summary { cursor: pointer; font-weight: 700; }
.intro-curriculum ol { margin: 12px 0; padding-left: 1.5em; }
.intro-curriculum li { padding: 3px 0; }
.intro .teacher-card { max-width: var(--read); }
.teacher-stats { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 12px; }
.teacher-stats strong { font-variant-numeric: tabular-nums; }
.course-news { max-width: var(--read); padding: 40px 0 80px; }
.course-news h2 { font-size: 20px; margin-bottom: 20px; }
.course-news .news li { padding: 12px 0; border-bottom: 1px solid var(--line); }
.intro-dates { font-size: 14px; color: var(--muted); }
@media (max-width: 600px) { .intro .intro-grid { grid-template-columns: 1fr; } .course-hero { padding-top: 32px; } }
</style>
<script src="nav.js" defer></script>
<script src="app.js" defer></script>
<script src="course-intro.js" defer></script>
<script src="community.js" defer></script>
</head>
<body data-page="course">
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="site-head"></header>
<main id="main"><p class="loading">불러오는 중…</p></main>
<footer class="site-foot"><div class="wrap"><p>마이웨이 아카데미</p><p>진도·노트는 이 브라우저에만 저장됩니다.</p></div></footer>
</body>
</html>
