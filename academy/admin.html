<meta name="robots" content="noindex, nofollow">
<title>회원 관리 · 마이웨이 아카데미</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pages.css">
<script src="nav.js" defer></script>
<script type="module" src="auth.js"></script>
<script type="module" src="admin.js"></script>
</head>
<body data-page="admin">
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="site-head"></header>
<main id="main" class="page-main">
  <div class="wrap">
    <div class="page-hero"><p class="eyebrow">관리자</p><h1>회원 관리</h1>
      <p class="page-lead">결제를 확인한 회원의 등급을 '유료'로 바꿉니다. 바꾼 기록은 서버에 남습니다. 권한 확인은 서버가 하므로 이 화면 주소를 알아도 관리자가 아니면 아무것도 보이지 않습니다.</p></div>
    <p id="adm-msg" class="auth-msg" role="status" aria-live="polite">불러오는 중…</p>
    <div id="adm-tools" hidden>
      <label for="adm-q">이메일·이름·회원 번호 찾기</label>
      <input id="adm-q" type="search" maxlength="120" autocomplete="off">
      <p class="muted" id="adm-count"></p>
      <p class="auth-row"><button type="button" class="btn ghost small" id="csv-all">CSV 내보내기 (전체 회원 관리용)</button>
        <button type="button" class="btn ghost small" id="csv-mkt">CSV 내보내기 (소식 받기 동의자만 — 마케팅 발송용)</button></p>
      <p class="muted">마케팅 메일은 '소식 동의' 회원에게만 보낼 수 있습니다. 동의일로부터 2년이 지난 회원은 다시 동의를 받아야 합니다.</p>
      <div class="adm-table-wrap"><table class="adm-table">
        <thead><tr><th scope="col">이메일</th><th scope="col">이름</th><th scope="col">등급</th><th scope="col">소식 동의</th><th scope="col">완료 수업</th><th scope="col">학습 시간</th><th scope="col">마지막 학습</th><th scope="col">가입일</th><th scope="col">회원 번호</th><th scope="col">변경</th></tr></thead>
        <tbody id="adm-rows"></tbody>
      </table></div>
    </div>
  </div>
</main>
</body>
</html>
